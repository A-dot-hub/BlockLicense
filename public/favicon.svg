<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#013330" />
      <stop offset="100%" stop-color="#024945" />
    </linearGradient>
    <linearGradient id="shieldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="shieldRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="coreDiamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="blockCube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#cce7ff" stop-opacity="0.6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Hexagon Container -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" />
  <rect width="98" height="98" x="1" y="1" rx="23" fill="none" stroke="#059669" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Outer Faceted Cryptographic Shield -->
  <!-- Top Left Shield Facet -->
  <polygon points="50,15 22,28 22,54 50,68" fill="url(#shieldLeft)" fill-opacity="0.9" />
  
  <!-- Top Right Shield Facet -->
  <polygon points="50,15 78,28 78,54 50,68" fill="url(#shieldRight)" />

  <!-- Bottom Crest Point -->
  <polygon points="50,68 22,54 50,86 78,54" fill="#012422" fill-opacity="0.75" />
  
  <!-- Interlocking Blockchain Cube Facets -->
  <!-- Top Isomeric Block -->
  <polygon points="50,23 64,30 50,38 36,30" fill="url(#blockCube)" />
  <!-- Left Side Block Face -->
  <polygon points="36,30 50,38 50,53 36,45" fill="#047857" fill-opacity="0.8" />
  <!-- Right Side Block Face -->
  <polygon points="50,38 64,30 64,45 50,53" fill="#10b981" />

  <!-- Central Digital License Padlock/Prism Core -->
  <g filter="url(#glow)">
    <!-- Core Diamond Prism -->
    <polygon points="50,34 59,45 50,56 41,45" fill="url(#coreDiamond)" />
    <!-- Lock Shackle Arch -->
    <path d="M46,36 C46,31 54,31 54,36" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <!-- Keyhole / Verification Dot -->
    <circle cx="50" cy="45" r="2.2" fill="#013330" />
    <path d="M50,45 L50,50" stroke="#013330" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Accent Nodes & Light Ray -->
  <circle cx="50" cy="15" r="2" fill="#a7f3d0" />
  <circle cx="22" cy="28" r="1.5" fill="#a7f3d0" />
  <circle cx="78" cy="28" r="1.5" fill="#a7f3d0" />
  <circle cx="50" cy="86" r="2" fill="#34d399" />
</svg>
